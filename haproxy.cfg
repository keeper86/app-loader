global
    log stdout format raw local0
    maxconn 4096
    # Started as root to bind :80/:443, but run the workers unprivileged.
    user haproxy
    group haproxy

defaults
    log     global
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend tls_in
    bind *:443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    use_backend yawa_tls    if { req.ssl_sni -i yawa.polysim.work }
    use_backend yawa_tls    if { req.ssl_sni -i auth.yawa.polysim.work }
    use_backend polysim_tls if { req.ssl_sni -i app.polysim.work }
    use_backend polysim_tls if { req.ssl_sni -i auth.app.polysim.work }
    use_backend ee_tls      if { req.ssl_sni -i enterprise-engine.polysim.work }
    use_backend ee_tls      if { req.ssl_sni -i auth.enterprise-engine.polysim.work }
    default_backend home_tls

backend yawa_tls
    mode tcp
    server yawa 127.0.0.1:8443
backend polysim_tls
    mode tcp
    server polysim 127.0.0.1:8444
backend ee_tls
    mode tcp
    server enterprise-engine 127.0.0.1:8445
backend home_tls
    mode tcp
    server home 127.0.0.1:8446

frontend http_in
    bind *:80
    mode http

    use_backend yawa_http    if { hdr(host) -i yawa.polysim.work }
    use_backend yawa_http    if { hdr(host) -i auth.yawa.polysim.work }
    use_backend polysim_http if { hdr(host) -i app.polysim.work }
    use_backend polysim_http if { hdr(host) -i auth.app.polysim.work }
    use_backend ee_http      if { hdr(host) -i enterprise-engine.polysim.work }
    use_backend ee_http      if { hdr(host) -i auth.enterprise-engine.polysim.work }
    default_backend home_http

backend yawa_http
    mode http
    server yawa 127.0.0.1:8080
backend polysim_http
    mode http
    server polysim 127.0.0.1:8081
backend ee_http
    mode http
    server enterprise-engine 127.0.0.1:8082
backend home_http
    mode http
    server home 127.0.0.1:8083
