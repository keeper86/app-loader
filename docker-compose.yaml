services:
    haproxy:
        image: haproxy:lts-alpine
        container_name: app-loader-haproxy
        network_mode: host
        restart: unless-stopped
        volumes:
            - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    home:
        image: caddy:alpine
        container_name: app-loader-home
        restart: unless-stopped
        ports:
            - '127.0.0.1:8083:80'
            - '127.0.0.1:8446:443'
        volumes:
            - ./Caddyfile.home:/etc/caddy/Caddyfile:ro
            - ./home:/srv
            - home_data:/data

volumes:
    home_data:
